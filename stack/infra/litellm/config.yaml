# LiteLLM v2 config. Model routes live in Postgres (STORE_MODEL_IN_DB=True):
# register/retarget aliases at runtime with scripts/bootstrap_models.py or the
# admin UI at http://localhost:4000/ui — no restart, no file edits.
model_list: []

litellm_settings:
  drop_params: true
  num_retries: 5
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
